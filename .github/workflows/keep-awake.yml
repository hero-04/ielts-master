# Render's free plan puts the backend to sleep after ~15 minutes without traffic,
# and the first request after that waits ~50 s for it to wake up. This pings a
# tiny endpoint every 10 minutes so it stays awake. (One always-on free service
# uses ~744 h/month, inside Render's 750 free instance hours.)
name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API
        run: curl -fsS --max-time 120 https://ielts-master-zxlv.onrender.com/api/auth/config/ || true
