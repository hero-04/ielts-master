name: Nightly database backup

# Dumps the production Postgres (Neon) every night and keeps the dump as a
# workflow artifact for 30 days. Also runnable by hand from the Actions tab.
#
# Setup (once): GitHub repo → Settings → Secrets and variables → Actions →
# New repository secret → name DATABASE_URL, value = your Neon connection string.

on:
  schedule:
    - cron: '17 22 * * *'   # 22:17 UTC = 03:17 Tashkent, daily
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Dump database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then echo "::error::DATABASE_URL secret is not set"; exit 1; fi
          STAMP=$(date -u +%Y-%m-%d_%H%M)
          # Neon's pooled endpoint (…-pooler…) does not support pg_dump; use the direct host.
          DIRECT_URL="${DATABASE_URL/-pooler/}"
          # pg_dump from the official Postgres 18 image — Neon runs Postgres 18 (pg_dump must be >= server),
          # no apt repositories involved.
          docker run --rm -e PGURL="$DIRECT_URL" -v "$PWD:/out" postgres:18 \
            sh -c 'pg_dump "$PGURL" --no-owner --no-privileges --format=custom --file="/out/ielts_master_'"$STAMP"'.dump"'
          ls -lh *.dump
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ env.STAMP }}
          path: '*.dump'
          retention-days: 30
          if-no-files-found: error
